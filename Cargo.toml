[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Format, links, network, password generator: the sdrop crate by tag (SPEC 2), not a copy.
sdrop = { git = "https://github.com/payneteasy/sdrop", tag = "v0.3.1" }
zeroize = "=1.9.1"
# The same system RNG sdrop uses: local history ids.
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# PBKDF2 with 600 000 iterations is too slow in a debug build without dependency optimization.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
