# cargo deny check (CI): vulnerabilities, licenses, crate sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates deep in the GPUI tree are not ours to replace; direct ones still fail.
unmaintained = "workspace"

[licenses]
version = 2
# BSL-1.0 (Boost, permissive, OSI approved): clipboard-win and error-code, the Windows clipboard of arboard.
# GPUI tree: BSD-2-Clause, 0BSD, CC0-1.0, Unlicense (permissive), MPL-2.0 (file-level copyleft,
# used unmodified: dwrote, cbindgen, option-ext).
allow = ["BSD-2-Clause", "0BSD", "CC0-1.0", "Unlicense", "MPL-2.0", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "BSL-1.0"]
confidence-threshold = 0.9

[licenses.private]
# sdrop and this workspace are not published (publish = false).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside this unpublished workspace.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/payneteasy/sdrop"]
